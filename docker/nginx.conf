# This top section defines the user and points to writable directories.
# This is the most critical part for fixing permission errors.
user www-data;
worker_processes auto;
pid /run/nginx/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    # Direct temporary files to the /tmp directory, which is always writable
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Send logs to standard output/error to be captured by `kubectl logs`
    # This completely avoids file permission issues for logging.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;

    # This server block is adapted directly from the Laravel documentation
    server {
        listen 80;
        server_name _; # Kubernetes will handle the domain name
        root /var/www/html/public;

        # These security headers are recommended by Laravel
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        charset utf-8;
        index index.php;

        # This location block is the core of Laravel's routing
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        # This block passes PHP scripts to the PHP-FPM process
        location ~ \.php$ {
            # NOTE: We use 127.0.0.1 because Nginx and PHP-FPM
            # are running in the same container.
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # This block denies access to dotfiles (.env, .git, etc.)
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}